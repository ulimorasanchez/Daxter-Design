<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daxter Design — Updates</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <img src="img/daxterlogo.jpg" class="brand-icon"> Daxter Design
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="shop.html">Sticker Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="updates.html" class="active">Updates</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
      <button class="nav-toggle"></button>
    </nav>
  </div>
</header>

<main>

  <section class="page-hero">
    <h1>Updates</h1>
    <p>New stickers, new videos, behind‑the‑scenes posts, and design announcements.</p>
  </section>

  <section>
    <div class="container grid-4" id="updatesGrid"></div>
  </section>

</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<script>
  const grid = document.getElementById("updatesGrid");

  DEFAULT_UPDATES.forEach(u => {
    grid.innerHTML += `
      <div class="post-card">
        <div class="thumb">
          <img src="${u.img}" alt="${u.title}">
        </div>
        <h3>${u.title}</h3>
        <p class="desc">${u.excerpt}</p>
        <div class="row">
          <span class="badge">${u.type}</span>
          <span class="video-meta">${timeAgo(u.date)}</span>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
