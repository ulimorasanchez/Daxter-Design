<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daxter Design — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <img src="img/daxterlogo.jpg" class="brand-icon" alt="Daxter Design logo">
        <span>Daxter Design</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="shop.html">Sticker Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Menu"></button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <h1>Art, animation, and stickers from Daxter Design.</h1>
        <p class="hero-sub">
          Animated stories, character art, and real sticker designs—everything in one place.
        </p>
        <div class="hero-actions">
          <a href="videos.html" class="btn btn-primary">Watch videos</a>
          <a href="shop.html" class="btn btn-ghost">Visit sticker shop</a>
        </div>
      </div>
      <div class="hero-art">
        <div id="brandBlob"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head">
        <h2>Featured Stickers</h2>
      </div>
      <div class="sticker-gallery">
        <div class="sticker-slider" id="stickerSlider"></div>
        <div class="sticker-controls">
          <button class="btn btn-sm btn-ghost" id="prevSticker">Prev</button>
          <button class="btn btn-sm btn-ghost" id="nextSticker">Next</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/shared.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>
<script>
  document.getElementById("brandBlob").innerHTML = heroBlip();
</script>

</body>
</html>
