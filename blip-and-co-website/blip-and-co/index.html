</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <img src="img/daxterlogo.jpg" class="brand-icon"> Daxter Design
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="shop.html">Sticker Shop</a></li>
        <li><a href="about.html">About</a></li>

        <li><a href="support.html">Support</a></li>
      </ul>
      <button class="nav-toggle"></button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <h1>Daxter Design</h1>
        <p class="hero-sub">Art, animation, stickers, and creative chaos.</p>
        <div class="hero-actions">
          <a href="videos.html" class="btn btn-primary">Watch Videos</a>
          <a href="shop.html" class="btn btn-ghost">Sticker Shop</a>
          <a href="support.html" class="btn btn-ghost">Support</a>
        </div>
      </div>

        <img src="img/daxterlogo.jpg" class="brand-icon">
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head"><h2>Featured Video</h2></div>
      <div id="featuredVideo"></div>
    </div>

</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<script>
  const featured = DEFAULT_VIDEOS.find(v => v.featured);
  if(featured){
    document.getElementById("featuredVideo").innerHTML = `
      <div class="video-card">
        <div class="thumb">${sceneArt(featured.thumb)}</div>
        <h3>${featured.title}</h3>
        <p class="desc">${featured.description}</p>
        <div class="video-meta">
          <a href="${featured.url}" target="_blank" class="btn btn-sm btn-primary">Watch</a>
        </div>
      </div>`;
  }
</script>

</body>
