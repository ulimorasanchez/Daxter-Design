<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daxter Studios — Updates</title>
<meta name="description" content="News, behind-the-scenes posts, new stickers, and video announcements from Daxter Studios.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <span class="blob" id="brandBlob"></span> Daxter Studios
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="shop.html">Sticker Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="updates.html" class="active">Updates</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Menu"></button>
    </nav>
  </div>
</header>

<main>

  <section class="page-hero">
    <h1>Updates</h1>
    <p>New stickers, new videos, behind‑the‑scenes posts, and studio announcements.</p>
  </section>

  <section>
    <div class="container" id="updatesGrid"></div>
  </section>

</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<script>
  // Brand blob
  document.getElementById("brandBlob").innerHTML = heroBlip();

  // Render updates
  const grid = document.getElementById("updatesGrid");

  DEFAULT_UPDATES.forEach(u => {
    const badgeClass = {
      video: "badge-video",
      sticker: "badge-sticker",
      bts: "badge-bts",
      event: "badge-event"
    }[u.type] || "badge-video";

    grid.innerHTML += `
      <div class="post-card">
        <div class="thumb">
          ${stickerArt(u.art)}
        </div>
        <div>
          <span class="badge ${badgeClass}">${u.type}</span>
          <h3>${u.title}</h3>
          <p class="desc">${u.excerpt}</p>
          <p class="video-meta">${timeAgo(u.date)}</p>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
