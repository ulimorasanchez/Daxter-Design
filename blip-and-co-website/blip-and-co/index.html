<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blip & Co. — Animated Shorts</title>
<meta name="description" content="Weekly animated shorts about Blip, Doodle, and Nib.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand"><span class="blob" id="brandBlob"></span> Blip & Co.</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="shop.html">Sticker Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="updates.html">Updates</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Menu"></button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <h1>Small animated stories that stick with you</h1>
        <p class="hero-sub">Blip, Doodle, and Nib star in weekly shorts full of chaos, snacks, and questionable decisions.</p>
        <div class="hero-actions">
          <a href="videos.html" class="btn btn-primary">Watch videos</a>
          <a href="shop.html" class="btn btn-ghost">Sticker shop</a>
        </div>
      </div>
      <div class="hero-art">
        <div class="blob-wrap wobble" id="heroBlob"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head"><h2>Featured video</h2></div>
      <div id="featuredVideo"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="newsletter">
        <h2>Join the newsletter</h2>
        <form id="newsletterForm">
          <input type="email" required placeholder="you@email.com">
          <button class="btn btn-primary">Subscribe</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>
<script>
  document.getElementById("brandBlob").innerHTML = heroBlip();
  document.getElementById("heroBlob").innerHTML = heroBlip();

  const featured = DEFAULT_VIDEOS.find(v => v.featured);
  if(featured){
    document.getElementById("featuredVideo").innerHTML = `
      <div class="video-card">
        <div class="thumb">${sceneArt(featured.thumb)}</div>
        <h3>${featured.title}</h3>
        <p class="desc">${featured.description}</p>
        <div class="video-meta">
          <span>${formatViews(featured.views)}</span>
          <a href="${featured.url}" target="_blank" class="btn btn-sm btn-primary">Watch</a>
        </div>
      </div>`;
  }

  document.getElementById("newsletterForm").addEventListener("submit", e => {
    e.preventDefault();
    showToast("Subscribed! 💌");
    e.target.reset();
  });
</script>
</body>
</html>
