<script>
  const featured = DEFAULT_VIDEOS.find(v => v.featured);

        </div>

        <h3>${featured.title}</h3>
        <p class="desc">${featured.description}</p>
        <div class="video-meta">
          <a href="${featured.url}" target="_blank" class="btn btn-sm btn-primary">Watch</a>
        </div>
      </div>`;
  }
</script>

<!-- ⭐ STICKER SLIDER LOGIC -->
<script>
  const slider = document.querySelector('.sticker-slider');
  const slides = document.querySelectorAll('.sticker-slide');
  const prevBtn = document.getElementById('prevSticker');
  const nextBtn = document.getElementById('nextSticker');

  let currentIndex = 0;
  let autoTimer = null;

  function showSlide(index) {
    if (index < 0) index = slides.length - 1;
    if (index >= slides.length) index = 0;

    currentIndex = index;
    slider.style.transform = `translateX(-${currentIndex * 100}%)`;
  }

  function nextSlide() {
    showSlide(currentIndex + 1);
  }

  function prevSlide() {
    showSlide(currentIndex - 1);
  }

  function startAutoSlide() {
    clearInterval(autoTimer);
    autoTimer = setInterval(nextSlide, 4000); // 4 seconds
  }

  nextBtn.addEventListener('click', () => {
    nextSlide();
    startAutoSlide();
  });

  prevBtn.addEventListener('click', () => {
    prevSlide();
    startAutoSlide();
  });

  showSlide(0);
  startAutoSlide();
</script>
