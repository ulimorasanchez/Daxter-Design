  <div class="container">

      <ul class="nav-links">

        <li><a href="videos.html">Videos</a></li>

        <li><a href="about.html">About</a></li>

      </ul>
      <button class="nav-toggle" aria-label="Menu"></button>

</header>

<main>
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <h1>Art, animation, and stickers from Daxter Design.</h1>
        <p class="hero-sub">
          Animated stories, character art, and real sticker designs—everything in one place.
        </p>

        </div>
      </div>
      <div class="hero-art">
        <div id="brandBlob"></div>
      </div>
    </div>
  </section>

  <section>
  <div class="container">
    <div class="section-head">
      <h2>Featured Videos</h2>
    </div>
    <div id="featuredVideo"></div>
  </div>
</section>


  <section>
    <div class="container">
      <div class="section-head">
        <h2>Featured Stickers</h2>
      </div>
      <div class="sticker-gallery">
        <div class="sticker-slider" id="stickerSlider"></div>
        <div class="sticker-controls">
          <button class="btn btn-sm btn-ghost" id="prevSticker">Prev</button>
          <button class="btn btn-sm btn-ghost" id="nextSticker">Next</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/shared.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>
<script>
  document.getElementById("brandBlob").innerHTML = heroBlip();
</script>

  <script>
    const featured = window.DEFAULT_VIDEOS.filter(v => v.featured);
const featuredVideo = document.getElementById("featuredVideo");

if (featured.length > 0) {
  const v = featured[0];
  featuredVideo.innerHTML = `
    <div class="video-card">
      <div class="thumb">
        <img src="${v.thumb}" alt="${v.title}">
      </div>
      <h3>${v.title}</h3>
      <p class="desc">${v.description}</p>
      <a href="${v.url}" target="_blank" class="btn btn-primary">Watch</a>
    </div>
  `;
}
</script>

  <script>
  const stickerGallery = document.getElementById("featuredStickerGallery");
  const stickers = window.DEFAULT_STICKERS;
  let currentSticker = 0;

  function showSticker() {
    const s = stickers[currentSticker];

    // Clear previous sticker
    stickerGallery.innerHTML = "";

    // Create new sticker element
    const img = document.createElement("img");
    img.src = s.img;
    img.alt = s.name;

    stickerGallery.appendChild(img);

    // Move to next sticker
    currentSticker = (currentSticker + 1) % stickers.length;
  }

  // Show first sticker immediately
  showSticker();

  // Change sticker every 4 seconds
  setInterval(showSticker, 4000);
</script>


</body>
</html>
