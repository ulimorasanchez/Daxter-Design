<main>

  <section>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<script>
  const featured = DEFAULT_VIDEOS.find(v => v.featured);
  if (featured) {
    document.getElementById("featuredVideo").innerHTML = `
      <div class="video-card">
        <div class="thumb">
          <img src="${featured.thumb}" alt="${featured.title}">
        </div>

        <h3>${featured.title}</h3>
        <p class="desc">${featured.description}</p>
        <div class="video-meta">
          <a href="${featured.url}" target="_blank" class="btn btn-sm btn-primary">Watch</a>
        </div>
      </div>`;
  }
</script>

<!-- ⭐ AUTO-SLIDE STICKER JS -->
<script>
  const slider = document.querySelector('.sticker-slider');
  const stickers = document.querySelectorAll('.sticker-slider a');
  let index = 0;

  function slideStickers() {
    index++;
    if (index >= stickers.length) index = 0;
    slider.style.transform = `translateX(-${index * 100}%)`;
  }

  setInterval(slideStickers, 3000);
</script>

</body>
