<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Blip & Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand"><span class="blob" id="brandBlob"></span> Blip & Co.</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="shop.html">Sticker Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="updates.html">Updates</a></li>
      </ul>
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="cart.html" class="nav-cart" aria-label="Cart"><span class="icon-cart-slot"></span><span class="cart-count">0</span></a>
        <button class="nav-toggle" aria-label="Menu"></button>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero" style="padding-bottom:0;">
    <div class="container">
      <span class="eyebrow">🛒 checkout</span>
      <h1>Your cart</h1>
    </div>
  </section>

  <section style="padding:30px 0 100px;">
    <div class="container" id="cartLayout" style="display:grid; grid-template-columns: 1.6fr 1fr; gap:40px; align-items:flex-start;">
      <div id="cartLines"></div>
      <div id="summaryWrap"></div>
    </div>
  </section>

  <!-- CHECKOUT MODAL-ISH SECTION -->
  <section id="checkoutSection" style="display:none; padding-bottom:100px;">
    <div class="container" style="max-width:640px;">
      <div class="form-card">
        <span class="eyebrow">📦 shipping & payment</span>
        <h2 style="margin-top:12px;">Almost there</h2>
        <form id="checkoutForm">
          <div class="form-field"><label for="name">Full name</label><input id="name" required placeholder="Jordan Rivera"></div>
          <div class="form-field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@email.com"></div>
          <div class="form-field"><label for="address">Shipping address</label><input id="address" required placeholder="123 Sticker Lane, Brooklyn, NY"></div>
          <div class="form-field">
            <label for="pay">Payment method</label>
            <select id="pay">
              <option>Stripe (credit / debit card)</option>
              <option>PayPal</option>
              <option>Apple Pay</option>
            </select>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Place order — <span id="checkoutTotal">$0.00</span></button>
          <p style="font-size:12px; color:var(--ink-soft); text-align:center; margin-top:10px;">This is a demo checkout. Connect Stripe or PayPal to process real payments — see README.md.</p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>
<script>
  document.getElementById("brandBlob").innerHTML = heroBlip();
  const SHIPPING = 3.5;

  function renderCart(){
    const cart = getCart();
    const layout = document.getElementById("cartLayout");
    const linesEl = document.getElementById("cartLines");
    const summaryEl = document.getElementById("summaryWrap");

    if(!cart.length){
      layout.style.gridTemplateColumns = "1fr";
      linesEl.innerHTML = `
        <div class="empty-state sticker-card" style="--rot:0deg;">
          <div class="blob-wrap">${heroBlip()}</div>
          <h3>Your cart's a little empty.</h3>
          <p style="color:var(--ink-soft);">Blip is judging you gently. Go find a sticker you like.</p>
          <a href="shop.html" class="btn btn-primary">Browse the shop</a>
        </div>`;
      summaryEl.innerHTML = "";
      document.getElementById("checkoutSection").style.display = "none";
      return;
    }

    layout.style.gridTemplateColumns = "1.6fr 1fr";
    let subtotal = 0;
    linesEl.innerHTML = cart.map(line => {
      const item = findStickerOrBundle(line.id);
      if(!item) return "";
      const lineTotal = item.price * line.qty;
      subtotal += lineTotal;
      return `
        <div class="cart-line">
          <div class="cl-thumb" style="padding:8px;">${mediaFor(item, stickerArt(item.art || (item.items ? STICKERS.find(s=>s.id===item.items[0]).art : "")))}</div>
          <div class="info">
            <h4 style="margin:0 0 4px;">${item.name}</h4>
            <span class="price-tag">${fmtPrice(item.price)}</span>
          </div>
          <div class="qty">
            <button data-dec="${item.id}">−</button>
            <span style="font-family:var(--font-mono); min-width:18px; text-align:center;">${line.qty}</span>
            <button data-inc="${item.id}">+</button>
          </div>
          <div style="font-family:var(--font-mono); font-weight:700; min-width:70px; text-align:right;">${fmtPrice(lineTotal)}</div>
          <button data-remove="${item.id}" class="btn-sm btn" style="background:var(--white);">✕</button>
        </div>`;
    }).join("");

    const shipping = subtotal > 0 ? SHIPPING : 0;
    const total = subtotal + shipping;
    summaryEl.innerHTML = `
      <div class="cart-summary">
        <h3 class="mt-0">Order summary</h3>
        <div class="summary-row"><span>Subtotal</span><span>${fmtPrice(subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${fmtPrice(shipping)}</span></div>
        <div class="summary-row total"><span>Total</span><span>${fmtPrice(total)}</span></div>
        <button class="btn btn-primary btn-block" id="goCheckout" style="margin-top:14px;">Checkout</button>
        <a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:10px;">Keep shopping</a>
      </div>`;
    document.getElementById("checkoutTotal").textContent = fmtPrice(total);

    document.getElementById("goCheckout").addEventListener("click", () => {
      document.getElementById("checkoutSection").style.display = "block";
      document.getElementById("checkoutSection").scrollIntoView({ behavior: "smooth" });
    });
  }

  document.addEventListener("click", e => {
    const inc = e.target.closest("[data-inc]");
    const dec = e.target.closest("[data-dec]");
    const rem = e.target.closest("[data-remove]");
    if(inc){ const c = getCart().find(l=>l.id===inc.dataset.inc); setQty(inc.dataset.inc, c.qty+1); renderCart(); }
    if(dec){ const c = getCart().find(l=>l.id===dec.dataset.dec); if(c.qty<=1){ removeFromCart(dec.dataset.dec); } else { setQty(dec.dataset.dec, c.qty-1); } renderCart(); }
    if(rem){ removeFromCart(rem.dataset.remove); renderCart(); }
  });

  document.getElementById("checkoutForm").addEventListener("submit", e => {
    e.preventDefault();
    saveCart([]);
    document.getElementById("checkoutSection").style.display = "none";
    document.getElementById("cartLines").innerHTML = `
      <div class="empty-state sticker-card" style="--rot:0deg;">
        <div class="blob-wrap">${heroBlip()}</div>
        <h3>Order placed! 🎉</h3>
        <p style="color:var(--ink-soft);">Confirmation on its way to your inbox. Blip is already packing your stickers (badly, but with heart).</p>
        <a href="shop.html" class="btn btn-primary">Back to shop</a>
      </div>`;
    document.getElementById("summaryWrap").innerHTML = "";
    document.getElementById("cartLayout").style.gridTemplateColumns = "1fr";
  });

  renderCart();
  onStoreUpdate(renderCart);</script>
</body>
</html>
